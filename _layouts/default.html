<!DOCTYPE html>
<html lang="de" class="w-full h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{site.baseurl}}src/fonts.css" rel="stylesheet" />
    <link href="{{site.baseurl}}dist/output.css" rel="stylesheet" />
    <link rel="icon" href="{{site.baseurl}}src/fahrrad_symbol_bw.png" />
    <title>{{page.title}}</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script src="{{site.baseurl}}src/darkmode.js"></script>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
  </head>

  <body
    class="base-font flex h-full w-full flex-col overflow-hidden text-sm xl:text-base bg-gradient-to-r from-lime-100 dark:from-lime-950 from-10% via-lime-100 dark:via-lime-950 via-70% to-lime-200 dark:to-lime-900"
  >
    {%if page.header%}
    <header class="fixed top-0 left-0 z-20 w-full h-16 flex-0 xl:h-24">
      {% include header.html %}
    </header>
    {%endif%}
    <!-- check responsive styling upon 1280px (xl) breakpoint -->
    <main
      class="overflow-y-auto flex-1 px-8 pt-12 pb-12 mt-16 w-full h-full xl:mt-24 xl:px-0 xl:pb-20 xl:pt-20 dark:text-neutral-300 text-neutral-600"
      id="main-container"
    >
      <div class="relative mx-auto max-w-6xl">{{content}}</div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const menu = document.querySelector("#menu");
        const menuContent = document.querySelector("#menu-content");
        const mainContainer = document.querySelector("#main-container");
        if (menu) {
          menu.addEventListener("click", (e) => {
            menuContent.classList.toggle("hidden");
            mainContainer.classList.toggle("blur-sm");
          });
        }
      });
    </script>
  </body>
</html>
