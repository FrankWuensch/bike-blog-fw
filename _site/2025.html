      <div class="relative mx-auto max-w-6xl"><h4 id="30092025---21102025">30.09.2025 - 21.10.2025</h4>

<h1 id="oberstdorf---flensburg---westerland">Oberstdorf - Flensburg - Westerland</h1>

<details open="">
  <summary class="hover:cursor-pointer">
    Klicken, um Karte anzuzeigen oder zu verbergen.
  </summary>
  <div id="map" style="height: 520px; margin-top: 2rem;"></div>
  <script>
  const map = L.map("map").setView([48.64683407492267, 9.451204869722357], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution:
      '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  const url = "src/gpx_files/KT-Oslo.gpx";
  console.log(url);
  const options = {
    async: true,
    polyline_options: { color: "red" },
  };

  const gpx = new L.GPX(url, options)
    .on("loaded", (e) => {
      map.fitBounds(e.target.getBounds());
    })
    .addTo(map);
</script>

</details>

<p><br /></p>
</div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const menu = document.querySelector("#menu");
        const menuContent = document.querySelector("#menu-content");
        const mainContainer = document.querySelector("#main-container");
        if (menu) {
          menu.addEventListener("click", (e) => {
            menuContent.classList.toggle("hidden");
            mainContainer.classList.toggle("blur-sm");
          });
        }
      });
    </script>
